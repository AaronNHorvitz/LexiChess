<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | LexiChess</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ request.url_for('home_page') }}">
          <span class="brand-mark">LX</span>
          <span class="brand-copy">
            <strong>LexiChess</strong>
            <small>The Arena For Self-Hosted LLM Chess</small>
          </span>
        </a>
        <nav class="site-nav">
          <a href="{{ request.url_for('leaderboard_page') }}">Chess Index</a>
          <a href="{{ request.url_for('tournaments_page') }}">Tournaments</a>
          <a href="{{ request.url_for('featured_showmatch_page') }}">Featured Showmatch</a>
          <a href="{{ request.url_for('showmatch_control_page') }}">Broadcast Control</a>
          <a href="{{ request.url_for('moderation_queue_page') }}">Moderation Queue</a>
        </nav>
      </header>
      <main class="content-shell">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
