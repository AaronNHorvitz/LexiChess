[project]
name = "lexichess"
version = "0.1.0"
description = "MVP runtime for evaluating LLMs through chess"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "LexiChess contributors" }]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-chess>=1.999,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "coverage[toml]>=7.6.0,<8.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
lexichess = "lexichess.cli:main"

[tool.poetry]
packages = [{ include = "lexichess", from = "src" }]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["lexichess"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["src/lexichess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
