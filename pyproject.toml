```toml
[tool.poetry]
name = "lexichess"
version = "0.1.0"
description = "A Python-based platform for LLM chess tournaments, tutoring, and API functionality"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
python-chess = "^1.0.0"
sqlite3 = "*"  # Included in Python standard library
requests = "^2.28.0"  # For API-based LLMs (e.g., Grok, OpenAI)
ollama = "^0.1.0"  # For local LLMs (e.g., LLaMA)
flask = "^2.2.0"  # Backend for web UI and API
flask-restful = "^0.3.9"  # For API endpoints
jupyter = "^1.0.0"  # For /Notebooks/
three = "^0.1.0"  # For Three.js in tutoring avatar (via PyPI wrapper)

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
black = "^22.0.0"
flake8 = "^5.0.0"
pytest-cov = "^4.0.0"  # For test coverage

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
```