[project]
name = "lexichess"
version = "0.1.0"
description = "MVP runtime for evaluating LLMs through chess"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "LexiChess contributors" }]
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "python-chess>=1.999,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
pytest = "^8.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
